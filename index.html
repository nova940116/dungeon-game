<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#141a26" />
    <title>화살 던전</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="is-title">
    <div id="app" class="app"></div>

    <header id="hud" class="hud">
      <div class="hud__row">
        <div id="hud-room" class="pill">방 1</div>
        <div class="bar">
          <i id="hud-hp-fill" class="bar__fill bar__fill--hp"></i>
          <i id="hud-shield-fill" class="bar__fill bar__fill--shield"></i>
          <span id="hud-hp-text" class="bar__label">100 / 100</span>
        </div>
        <button id="hud-pause" class="icon-btn" type="button" aria-label="일시정지 (Esc)" title="일시정지 (Esc / P)">⏸</button>
        <button id="hud-sound" class="icon-btn" type="button" aria-label="소리 켜기/끄기 (M)" title="소리 켜기/끄기 (M)">🔊</button>
      </div>
      <div class="hud__row">
        <div id="hud-level" class="pill">Lv 1</div>
        <div class="bar"><i id="hud-xp-fill" class="bar__fill bar__fill--xp"></i></div>
      </div>
      <section class="build" aria-label="현재 능력치와 스킬">
        <div id="hud-stats" class="build__stats"></div>
        <ul id="hud-skills" class="build__skills"></ul>
      </section>
    </header>

    <div id="damage-layer" class="damage-layer"></div>
    <div id="dread-vignette" class="dread-vignette"></div>
    <div id="boss-bar" class="boss-bar" aria-live="polite">
      <div class="boss-bar__head">
        <span id="boss-bar-title" class="boss-bar__title"></span>
        <span id="boss-bar-name" class="boss-bar__name"></span>
      </div>
      <div class="boss-bar__track">
        <i id="boss-bar-ghost" class="boss-bar__ghost"></i>
        <i id="boss-bar-fill" class="boss-bar__fill"></i>
        <span id="boss-bar-marks" class="boss-bar__marks"></span>
      </div>
    </div>
    <div id="boss-intro" class="boss-intro"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="hurt-vignette" class="hurt-vignette"></div>
    <div id="fade" class="fade"></div>
    <div id="screen" class="screen is-hidden"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
